<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" sizes="32x32" href="assets/shield_tab_icon.svg" />
  <link rel="icon" type="image/svg+xml" sizes="16x16" href="assets/shield_tab_icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/shield_tab_icon.svg" />

  <title>Cyberglossary - Cybersecurity Explained Simply</title>
  <meta name="title" content="Cyberglossary" />
  <meta name="description" content="No phishing, just fishing for knowledge. A simple, open database of cybersecurity terms explained in plain English." />

  <!-- Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shraddha-o8.github.io/cyberglossary/" />
  <meta property="og:title" content="Cyberglossary" />
  <meta property="og:description" content="No phishing, just fishing for knowledge. A simple, open database of cybersecurity terms explained in plain English." />
  <meta property="og:image" content="https://shraddha-o8.github.io/cyberglossary/assets/Cyberglossary.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://shraddha-o8.github.io/cyberglossary/" />
  <meta property="twitter:title" content="Cyberglossary" />
  <meta property="twitter:description" content="No phishing, just fishing for knowledge. A simple, open database of cybersecurity terms explained in plain English." />
  <meta property="twitter:image" content="https://shraddha-o8.github.io/cyberglossary/assets/Cyberglossary.png" />
</head>
<body>

  <!-- Fullscreen Interactive Canvas Background -->
  <canvas id="node-graph-canvas"></canvas>

  <!-- Theme Switcher -->
  <div class="theme-toggle-container">
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
      <svg class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <svg class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-title">
        <svg class="icon-shield" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
        </svg>
        <h1>Cyberglossary</h1>
      </div>

      <!-- Typewriter Subtitle -->
      <p class="hero-tagline">
        <span id="typewriter-text"></span><span class="typewriter-cursor">|</span>
      </p>
      <p class="hero-subtext">A simple, open database of cybersecurity terms explained in plain English.</p>
    </div>
  </header>

  <main class="container">

    <!-- HOME VIEW -->
    <div id="home-view" class="view">

      <!-- Controls: Search All & Shimmer Randomizer -->
      <section class="controls-section">
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="home-search-input" placeholder="Search all cybersecurity terms..." aria-label="Search all terms">
        </div>

        <!-- Shimmer Animated Button -->
        <button id="random-btn" class="btn btn-shimmer">
          <span class="shimmer-sparkle"></span>
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="12" height="12" x="2" y="10" rx="2" ry="2"></rect>
            <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3.18l-1.74-1.74a2.24 2.24 0 0 0-3.18 0L13 9.08"></path>
            <path d="M6 14h.01"></path>
            <path d="M10 18h.01"></path>
          </svg>
          <span class="btn-text">Random Term</span>
        </button>
      </section>

      <!-- Random Term Highlight Card -->
      <section id="random-card" class="random-card hidden">
        <div class="card-header">
          <span class="badge">Term of the Moment</span>
          <button id="close-random-btn" class="close-btn" aria-label="Close card">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <h2 id="random-term-title"></h2>
        <span id="random-term-topic" class="topic-tag"></span>
        <p class="short-def"><strong>Quick Def:</strong> <span id="random-term-short"></span></p>
        <p class="layman-def"><strong>In Plain English:</strong> <span id="random-term-layman"></span></p>
      </section>

      <!-- Section Heading -->
      <div class="section-title">
        <h2>Explore Cybersecurity Topics</h2>
      </div>

      <!-- Square Topic Cards Grid -->
      <section id="topics-grid" class="topics-grid">
        <!-- Rendered dynamically -->
      </section>

      <!-- Search Results Grid on Home Page -->
      <section id="home-search-results" class="terms-grid hidden">
        <!-- Rendered dynamically -->
      </section>

    </div>

    <!-- SINGLE TOPIC PAGE VIEW -->
    <div id="topic-view" class="view hidden">

      <div class="breadcrumb-nav">
        <a href="#/" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
          <span>Back to All Topics</span>
        </a>
      </div>

      <div class="topic-view-header">
        <div class="topic-title-group">
          <h2 id="current-topic-name"></h2>
          <span id="current-topic-count" class="topic-count-badge"></span>
        </div>

        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="topic-search-input" placeholder="Search within this topic..." aria-label="Search within topic">
        </div>
      </div>

      <section id="topic-terms-grid" class="terms-grid">
        <!-- Terms inserted via JS -->
      </section>

      <div id="no-topic-results" class="no-results hidden">
        <p>No matching terms found in this topic.</p>
      </div>

    </div>

  </main>

  <!-- Floating Sticky Banner -->
    <aside class="sticky-banner-wrapper">
      <a href="https://github.com/shraddha-o8" target="_blank" rel="noopener noreferrer" class="sticky-banner" aria-label="Visit GitHub Profile">
        <span class="banner-badge">
          <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </span>
        <span class="banner-text">Explore more security tools by <strong>shraddha-o8</strong></span>
        <span class="banner-trailing">→</span>
      </a>
    </aside>

  <script src="js/index.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
